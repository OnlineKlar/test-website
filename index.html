<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{site.title}}</title>
  <meta name="description" content="{{site.description}}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header" id="header">
    <nav class="nav container">
      <div class="nav__logo">{{site.title}}</div>
      <ul class="nav__links">
        <li><a href="#leistungen">Leistungen</a></li>
        <li><a href="#ueber-uns">Über uns</a></li>
        <li><a href="#kontakt">Kontakt</a></li>
      </ul>
    </nav>
  </header>
  <main>
    <section class="hero">
      <div class="container">
        <div class="hero__content reveal">
          <h1 class="hero__title">{{hero.title}}</h1>
          <p class="hero__subtitle">{{hero.subtitle}}</p>
          <a href="#kontakt" class="btn btn--primary">{{hero.cta}}</a>
        </div>
      </div>
    </section>
    <section class="leistungen" id="leistungen">
      <div class="container">
        <h2 class="section-title reveal">{{leistungen.title}}</h2>
        <div class="grid grid--3" id="leistungen-grid"></div>
      </div>
    </section>
    <section class="kontakt" id="kontakt">
      <div class="container">
        <h2 class="section-title reveal">{{kontakt.title}}</h2>
        <div class="kontakt__grid">
          <div class="kontakt__info reveal">
            <p id="kontakt-text"></p>
            <a id="kontakt-email" href="#" class="kontakt__email"></a>
          </div>
        </div>
      </div>
    </section>
  </main>
  <footer class="footer">
    <div class="container">
      <p>© <span id="year"></span> <span id="footer-title"></span></p>
    </div>
  </footer>
  <script src="js/main.js"></script>
</body>
</html>
