<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CMS</title>
  <style>
    :root { --accent: #e94560; --bg: #f8f8f6; --card: #ffffff; --text: #1a1a2e; --muted: #6b6b7b; --radius: 8px; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); }
    .login { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .login__box { background: var(--card); padding: 2.5rem; border-radius: var(--radius); width: 340px; box-shadow: 0 4px 24px rgba(0,0,0,0.08); }
    .login__box h1 { font-size: 1.4rem; margin-bottom: 1.5rem; }
    input, textarea { width: 100%; padding: 10px 14px; border: 1px solid #e0e0e0; border-radius: var(--radius); font-size: 1rem; margin-bottom: 1rem; font-family: inherit; }
    textarea { resize: vertical; min-height: 80px; }
    button { width: 100%; padding: 12px; background: var(--accent); color: white; border: none; border-radius: var(--radius); font-size: 1rem; cursor: pointer; }
    button:hover { opacity: 0.9; }
    .cms { display: none; max-width: 860px; margin: 0 auto; padding: 2rem; }
    .cms__header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
    .cms__header h1 { font-size: 1.5rem; }
    .save-btn { width: auto; padding: 12px 32px; }
    .section { background: var(--card); border-radius: var(--radius); padding: 1.5rem; margin-bottom: 1.5rem; }
    .section h2 { font-size: 0.8rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 1rem; }
    label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 4px; margin-top: 12px; }
    .status { margin-top: 1rem; padding: 10px; border-radius: var(--radius); font-size: 0.9rem; display: none; }
    .status.ok { background: #d4edda; color: #155724; display: block; }
    .status.err { background: #f8d7da; color: #721c24; display: block; }
  </style>
</head>
<body>
  <div class="login" id="login">
    <div class="login__box">
      <h1>CMS Login</h1>
      <input type="password" id="pw" placeholder="Passwort" onkeydown="if(event.key==='Enter') auth()" />
      <button onclick="auth()">Anmelden</button>
    </div>
  </div>
  <div class="cms" id="cms">
    <div class="cms__header">
      <h1>Website verwalten</h1>
      <button class="save-btn" onclick="saveContent()">Speichern & Deployen</button>
    </div>
    <div id="editor"></div>
    <div class="status" id="status"></div>
  </div>
  <script>
    const CMS_PASSWORD = "admin123";
    let content = {};
    function auth() {
      if (document.getElementById("pw").value === CMS_PASSWORD) {
        document.getElementById("login").style.display = "none";
        document.getElementById("cms").style.display = "block";
        loadContent();
      } else { alert("Falsches Passwort"); }
    }
    async function loadContent() {
      const res = await fetch("/content.json");
      content = await res.json();
      renderEditor();
    }
    function renderEditor() {
      document.getElementById("editor").innerHTML = `
        <div class="section"><h2>Website-Grunddaten</h2>
          <label>Titel</label><input id="site.title" value="${content.site.title}" />
          <label>Beschreibung</label><input id="site.description" value="${content.site.description}" />
        </div>
        <div class="section"><h2>Hero</h2>
          <label>Ueberschrift</label><input id="hero.title" value="${content.hero.title}" />
          <label>Untertext</label><textarea id="hero.subtitle">${content.hero.subtitle}</textarea>
          <label>Button-Text</label><input id="hero.cta" value="${content.hero.cta}" />
        </div>
        <div class="section"><h2>Kontakt</h2>
          <label>Ueberschrift</label><input id="kontakt.title" value="${content.kontakt.title}" />
          <label>Text</label><textarea id="kontakt.text">${content.kontakt.text}</textarea>
          <label>E-Mail</label><input id="kontakt.email" value="${content.kontakt.email}" />
        </div>`;
    }
    async function saveContent() {
      content.site.title = document.getElementById("site.title").value;
      content.site.description = document.getElementById("site.description").value;
      content.hero.title = document.getElementById("hero.title").value;
      content.hero.subtitle = document.getElementById("hero.subtitle").value;
      content.hero.cta = document.getElementById("hero.cta").value;
      content.kontakt.title = document.getElementById("kontakt.title").value;
      content.kontakt.text = document.getElementById("kontakt.text").value;
      content.kontakt.email = document.getElementById("kontakt.email").value;
      const status = document.getElementById("status");
      try {
        const res = await fetch("/api/save", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ content }) });
        if (res.ok) { status.className = "status ok"; status.textContent = "Gespeichert! Vercel deployed automatisch."; }
        else { throw new Error(await res.text()); }
      } catch(e) { status.className = "status err"; status.textContent = "Fehler: " + e.message; }
    }
  </script>
</body>
</html>
